<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthetic compact Section02</title><style>body{margin:0;background:#eef3f1;font-family:system-ui,sans-serif;color:#19372c}.fixture{padding:16px;background:#fff6d7;border-bottom:2px solid #d7a83e}.fixture h1{font-size:18px;margin:0 0 6px}.fixture p{margin:6px 0}.fixture button{font:inherit;padding:7px 10px;margin:4px 6px 0 0}.month-toolbar{max-width:1240px;margin:15px auto;padding:0 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}#review{max-width:1240px;margin:auto}</style></head>
<body><header class="fixture"><h1>SYNTHETIC — ตัวอย่างเท่านั้น ไม่ใช่ข้อมูลบริษัท</h1><p>แบบย่อซ่อนหัวเรื่องซ้ำ/คำอธิบายซ้ำและแถบเซฟเมื่อไม่มีร่าง · สถานะ “ยังไม่ทราบ” ในกล่องและตารางยังอยู่</p><button id="normal">แสดงปกติแบบย่อ</button><button id="draft">ใส่ร่างตัวอย่าง</button><button id="stale">ทดสอบคำเตือนข้อมูลไม่ตรง</button><p>การลองเซฟจะแจ้งข้อผิดพลาดตัวอย่างเท่านั้น · ไม่เชื่อม API หรือบันทึกข้อมูลใด</p></header><div class="month-toolbar"><strong id="month"></strong><button id="refresh">โหลดข้อมูลเดือนนี้ล่าสุด · ตัวอย่าง</button></div><div id="review"></div>
<script src="../stock_order_header.js?v=20261103-sales-only-r1"></script><script src="../stock_order_review.js?v=20261103-compact-chrome-r1"></script><script type="module">
import {salesOnlyFixture} from './stock-sales-only-fixture.mjs';
const fixture=salesOnlyFixture(window.AAFOrderHeader.currentBangkokMonth()),key='2.5|A|1220|2440|sheet';
const snapshot={rows:[{key,w:1220,l:2440,t:2.5,grade:'A',unit:'sheet',records:[]}],notesBySpec:{[key]:'หมายเหตุตัวอย่าง'},legacyNotesByThickness:{},revision:1,catalogRevision:1,reportDate:fixture.binding.reportDate,readAt:fixture.readModel.source.capturedAt,canSave:true,canEditFollowup:false};
const data=()=>({...fixture.review,readModel:fixture.readModel,displaySourceNote:'ข้อมูลตัวอย่างที่อ่านแล้ว · เก็บรายละเอียดไว้ในส่วนวันที่ข้อมูล ไม่ใช่การเชื่อมต้นทางสด'});
document.getElementById('month').textContent='ภาพรวมขายเดือนนี้ · '+fixture.binding.currentMonthSold.month+' · เวลาไทย';
const view=window.AAFOrderReviewUI.mount(document.getElementById('review'),data(),{compactChrome:true,readNotes:async()=>structuredClone(snapshot),saveNotes:async()=>{throw Error('ข้อผิดพลาดตัวอย่าง: ยังไม่ยืนยันผลบันทึก · ไม่มีการส่งข้อมูลจริง');}});
const normal=()=>view.update(data());document.getElementById('normal').onclick=normal;document.getElementById('refresh').onclick=normal;
document.getElementById('stale').onclick=()=>view.suspendSales('ตัวอย่าง: ชุดข้อมูลเดือนปัจจุบันไม่ตรงกัน · ไม่แสดงยอดเก่าแทน');
document.getElementById('draft').onclick=()=>{normal();view.applyNotesSnapshot(structuredClone(snapshot));const shadow=document.getElementById('review').shadowRoot;shadow.getElementById('stock-basis').open=true;const input=shadow.querySelector('[data-stock-note]');input.value='ร่างหมายเหตุตัวอย่างที่ยังไม่เซฟ';input.focus();input.dispatchEvent(new Event('input',{bubbles:true}));};
</script></body></html>
