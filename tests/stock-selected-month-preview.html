<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthetic controller month selection</title><style>body{margin:0;background:#edf2ef;color:#213c31;font:14px/1.5 system-ui,sans-serif}.fixture{padding:14px 20px;background:#fff4cf;border-bottom:2px solid #bca453}.fixture h1{font-size:18px;margin:0}.fixture p{margin:5px 0}#top,#slot{max-width:1240px;margin:16px auto;padding:0 16px}#top{box-sizing:border-box;border:1px solid #c8d7ce;border-radius:10px;padding:12px 16px;background:#fff}#top h3{margin:0 0 8px}#top strong{font-size:24px}#top .ss-order-quantity-detail,#top .ss-order-price-detail,#top .ss-kpi-meta{font-size:12px}#checks{font-weight:600}.failed{color:#a31f1f}</style></head>
<body><header class="fixture"><h1>SYNTHETIC — ทดสอบตัวเลือกเดือนจริงกับข้อมูลจำลอง</h1><p>ใช้ controller และ renderer ของหน้าเว็บจริง แต่ทุก GET ตอบจากข้อมูลจำลองในหน่วยความจำ · ไม่ส่งเครือข่าย ไม่รับ POST</p><p>ลองเดือนปัจจุบัน → เดือนก่อน → เดือนปัจจุบัน กล่องบนต้องไม่เปลี่ยนเป็นเดือนย้อนหลัง</p><p id="checks">กำลังเตรียมข้อมูลจำลอง…</p></header><div id="top"></div><div id="slot"></div>
<script src="../stock_order_header.js"></script><script src="../stock_review_notes_bridge.js"></script><script src="../stock_order_review.js?v=20261104-selected-month-dashboard-r1"></script><script src="../stock_order_controller.js?v=20261104-selected-month-dashboard-r1"></script><script type="module">
import {salesOnlyFixture} from './stock-sales-only-fixture.mjs';
const current=window.AAFOrderHeader.currentBangkokMonth(),[year,month]=current.split('-').map(Number),prior=new Date(Date.UTC(year,month-2,15)).toISOString().slice(0,7),f=salesOnlyFixture(current),a=salesOnlyFixture(prior,'b'),key='2.5|A|100|200|sheet';
const stock={ok:true,revision:7,report:{reportDate:current+'-01'},permissions:{followup:false},rows:[{key:'w100_l200_t2.5_gA',w:100,l:200,t:2.5,grade:'A',unit:'sheet',qty:50,freeQty:45,committedQty:5,note:'',followup:''}]};
const catalog={ok:true,revision:7,catalogRevision:2,stockReportDate:stock.report.reportDate,permissions:{pricesAndNotes:false},widgetState:{privateContent:{prices:{},currencies:{},notesByThickness:{},notesBySpec:{[key]:'หมายเหตุตัวอย่าง · อ่านอย่างเดียว'}}}};
f.envelope.availableMonths=[current,prior];
for(const row of a.review.rows)delete row.soldGroup;
a.review.metadata.title='ชุดตรวจย้อนหลังสังเคราะห์';a.review.metadata.sourceSalesCapturedAt=prior+'-22T01:00:00Z';
const archive={ok:true,readOnly:true,revision:7,stockReportDate:stock.report.reportDate,selectedMonth:prior,availableMonths:[current,prior],reviewRevision:'sha256:'+'c'.repeat(64),review:a.review,readModel:{kind:'dated-order-review',selectedMonth:prior,historical:true,sourceCapturedAt:a.review.metadata.sourceSalesCapturedAt,sourceIsLive:false,queueApplied:false,stale:true,warning:'ชุดตรวจย้อนหลังสังเคราะห์ ณ วันที่22 · ไม่ใช่ยอดปิดเดือน'}};
let getCount=0,postCount=0,archivePublished=false;
const paintTop=()=>{const wrapper=document.createElement('div');wrapper.innerHTML=window.AAFOrderHeader.render(null,new Set(),undefined,'ข้อมูลจำลองเท่านั้น',f.currentMonthSold);document.getElementById('top').replaceChildren(wrapper.querySelector('.ss-kpi-sold'));};
const checks=()=>{const node=document.getElementById('checks');node.textContent='GET จำลอง '+getCount+' ครั้ง · POST '+postCount+' · '+(archivePublished?'ผิดพลาด: เดือนย้อนหลังแตะกล่องปัจจุบัน':'กล่องบนคงเดือนปัจจุบัน '+current);node.classList.toggle('failed',archivePublished||postCount>0);};
window.AAFStockAccess={token:()=> 'synthetic-memory-session'};
window.AAFStockSummary={setOrderReview:(review,model)=>{if(review&&model?.kind==='dated-order-review')archivePublished=true;paintTop();checks();},invalidateCurrentMonthSold:()=>{paintTop();checks();}};
window.fetch=async(url,options={})=>{if(options.method&&options.method!=='GET'){postCount++;checks();throw Error('Synthetic preview blocks every write');}getCount++;checks();const query=new URL(url).searchParams;let payload,status=200;if(query.get('view')==='orderReview'){payload=query.get('month')===current?f.envelope:query.get('month')===prior?archive:null;if(!payload){status=422;payload={ok:false};}}else payload=query.has('catalogOnly')?catalog:stock;return{ok:status===200,status,json:async()=>structuredClone(payload)};};
paintTop();checks();window.AAFOrderReview.setAccess({...f.binding,notesReadOnly:true});window.AAFOrderReview.setRefreshHandler(()=>window.AAFOrderReview.syncCurrentSource({...f.binding,refreshReport:true}));await window.AAFOrderReview.attach(document.getElementById('slot'));
</script></body></html>
