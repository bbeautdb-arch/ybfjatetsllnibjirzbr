<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthetic annotation unlock preview</title>
<link rel="stylesheet" href="../stock_order_review.css">
<style>body{margin:0;background:linear-gradient(120deg,#dbe8dc,#f5f0e1);font-family:system-ui,sans-serif;color:#254333;padding:28px}header{max-width:1260px;margin:0 auto 22px}header p{font-size:13px}#review,.synthetic-free{max-width:1260px;margin:0 auto 22px}.synthetic-free{padding:18px;box-sizing:border-box;background:#f6faf5;border:1px solid #b7cbb7;border-radius:16px}button{cursor:pointer}</style>
</head><body><header><h2>ตัวอย่างหน้าทดสอบ · ข้อมูลสมมติเท่านั้น</h2><p>รหัสทดสอบ <b>DEMO-ONLY</b> · ไม่มีการเชื่อมบัญชีหรือบันทึกไปยังระบบจริง · ปุ่ม Excel แสดงรายการจำลองเพื่อทดสอบหน้าตรวจยืนยัน</p><button id="owner">จำลองผู้ดูแล · ไม่ใช้รหัส</button> <button id="expire">จำลองพนักงาน · ต้องปลดล็อก</button> <button id="readonly">จำลองลิงก์อ่านอย่างเดียว</button><p id="mode" role="status">โหมดจำลอง: พนักงาน · ต้องปลดล็อก</p></header><section class="synthetic-free"><h3>Free Stock จำลอง · เชื่อมร่างกับทะเบียนข้างล่าง</h3><div id="upper-free"></div></section><div id="review"></div>
<script src="../stock_order_review.js"></script><script>
'use strict';
const clone=value=>JSON.parse(JSON.stringify(value));
const sample=[{w:1220,l:2440,t:1.6,grade:'AAA',unit:'sheet',qty:1000,committedQty:300,freeQty:700},{w:1220,l:2440,t:2.5,grade:'A',unit:'sheet',qty:0,committedQty:100,freeQty:0},{w:100,l:2440,t:3.2,grade:'B',unit:'strip',qty:400,committedQty:100,freeQty:300}].map((r,i)=>({...r,rawKey:`w${r.w}_l${r.l}_t${r.t}_g${r.grade}`,key:[r.t,r.grade,Math.min(r.w,r.l),Math.max(r.w,r.l),r.unit].join('|'),sku:'SYNTHETIC-'+i,physicalAt:'',freeAt:''}));
let snapshot={revision:1,catalogRevision:1,reportDate:'2000-01-01',readAt:'2000-01-01T00:00:00Z',canSave:true,canEditFollowup:true,notesBySpec:Object.fromEntries(sample.map(r=>[r.key,'หมายเหตุสมมติ'])),legacyNotesByThickness:{},rows:sample.map(r=>({key:r.key,w:r.w,l:r.l,t:r.t,grade:r.grade,unit:r.unit,records:[{rawKey:r.rawKey,note:'',noteBy:'',noteAt:'',followup:'ติดตามตัวอย่าง',followupBy:'ผู้ทดสอบ',followupAt:'2000-01-01T00:00:00Z'}]}))};
snapshot.savedStockRegistry={revision:1,reportDate:snapshot.reportDate,readAt:snapshot.readAt,rows:sample};
let access={unlocked:false,eligible:true,expiresAt:null,message:''};
const review={metadata:{month:'2000-01',title:'Synthetic annotations'},rows:[],stockPools:[],queueReview:{rows:[],groups:[],poolQueues:[],stockBasis:{}}};
const host=document.getElementById('review');
const api=window.AAFOrderReviewUI.mount(host,review,{compactChrome:true,getAnnotationAccess:()=>access,readNotes:async()=>clone(snapshot),unlockAnnotations:async code=>{if(code!=='DEMO-ONLY')throw Error('Synthetic incorrect code');access={unlocked:true,eligible:true,expiresAt:new Date(Date.now()+30*60*1000).toISOString(),message:''};return {access:clone(access),snapshot:clone(snapshot)};},lockAnnotations:()=>{access={unlocked:false,eligible:true,expiresAt:null,message:''};return {access};},prepareAnnotationsFile:async()=>({canApply:true,snapshot:clone(snapshot),notesChanges:[{key:sample[0].key,before:snapshot.notesBySpec[sample[0].key],after:'หมายเหตุจากไฟล์ตัวอย่าง'}],followupChanges:[{rawKey:sample[0].rawKey,before:snapshot.rows[0].records[0].followup,after:'ข้อความติดตามจากไฟล์ตัวอย่าง'}],issues:[],counts:{notes:1,followup:1}}),saveChanges:async payload=>{if(!access.unlocked)throw Error('Synthetic locked');for(const c of payload.notesChanges)snapshot.notesBySpec[c.key]=c.after;for(const c of payload.followupChanges)for(const r of snapshot.rows)for(const record of r.records)if(record.rawKey===c.rawKey)record.followup=c.after;return {snapshot:clone(snapshot)};}});
const isolated=document.createElement('style');isolated.textContent='main > :not(#stock-basis):not(#notes-confirmation):not(.changes-toolbar){display:none!important}';host.shadowRoot.append(isolated);host.shadowRoot.getElementById('stock-basis').open=true;
api.attachFreeSurface(document.getElementById('upper-free'),{revision:snapshot.revision,reportDate:snapshot.reportDate});
function simulateAccess(next,label){access=next;snapshot.canSave=next.eligible;snapshot.canEditFollowup=next.eligible;api.applyNotesSnapshot(clone(snapshot));document.getElementById('mode').textContent='โหมดจำลอง: '+label;}
document.getElementById('owner').onclick=()=>simulateAccess({unlocked:true,eligible:true,owner:true,mode:'owner',expiresAt:null,message:''},'ผู้ดูแล · แก้ไขได้โดยไม่ใช้รหัส');
document.getElementById('expire').onclick=()=>simulateAccess({unlocked:false,eligible:true,owner:false,expiresAt:null,message:''},'พนักงาน · ต้องปลดล็อก');
document.getElementById('readonly').onclick=()=>simulateAccess({unlocked:false,eligible:false,owner:false,expiresAt:null,message:'ลิงก์อ่านอย่างเดียว · ตัวอย่างไม่มีสิทธิ์แก้ไข'},'ลิงก์อ่านอย่างเดียว');
</script></body></html>
