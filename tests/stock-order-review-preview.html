<script>
'use strict';
// Every value below is invented for UI testing. No authenticated source is read.
const clone=value=>JSON.parse(JSON.stringify(value)),native=(THB=0,USD=0)=>({THB,USD}),sumNative=(a,b)=>({THB:a.THB+b.THB,USD:a.USD+b.USD});
const key=row=>[row.t,row.grade,...[row.w,row.l].sort((a,b)=>a-b),row.unit].join('|');
const specs=[
  {t:2,w:1000,l:2000,grade:'A',unit:'sheet',physical:120,free:50,allocatedOctober:60,allocatedOther:10,price:35,currency:'THB'},
  {t:2,w:1000,l:2000,grade:'B',unit:'sheet',physical:0,free:0,allocatedOctober:0,allocatedOther:0,price:25,currency:'THB'},
  {t:2.5,w:1220,l:2440,grade:'A',unit:'sheet',physical:80,free:30,allocatedOctober:45,allocatedOther:5,price:2,currency:'USD'},
  {t:3.2,w:25,l:1000,grade:'F',unit:'strip',physical:500,free:400,allocatedOctober:100,allocatedOther:0,price:0.106,currency:'USD'}
].map(row=>({...row,key:key(row),noteKey:key(row)}));
const definitions=[
  {pool:0,qty:40,group:1,term:'TT',price:40,currency:'THB',customer:'ลูกค้าสมมติ ก'},
  {pool:0,qty:30,group:2,term:'TT',price:1.5,currency:'USD',customer:'ลูกค้าสมมติ ข'},
  {pool:2,qty:25,group:3,term:'LC',price:2.5,currency:'USD',customer:'ลูกค้าสมมติ ค'},
  {pool:2,qty:20,group:3,term:'TT',price:70,currency:'THB',customer:'ลูกค้าสมมติ ง'},
  {pool:3,qty:200,group:4,term:'TT',price:0.106,currency:'USD',customer:'ลูกค้าสมมติ จ'},
  {pool:1,qty:0,group:4,term:'TT',price:null,currency:null,customer:'ยกเลิกสมมติ'}
];
const rows=definitions.map((input,index)=>{const pool=specs[input.pool],id='SYNTH-LINE-'+index;return {id,orderId:'SYNTH-ORDER-'+index,ref:'SYNTH-REF-'+index,customer:input.customer,w:pool.w,l:pool.l,t:pool.t,grade:pool.grade,unit:pool.unit,qty:input.qty,cancelled:input.qty===0,term:input.term,sourceStatus:input.group===4?'Forecast':'มีเรือ',productStatus:input.group===1?'loaded':'waiting',payment:input.group===2?'เก็บเงินแล้ว':'รอเก็บ',etd:input.group===4?'':'2000-01-15',receiptDateText:input.group<=2?'2000-01-01':'',loaded:input.group===1?input.qty:0,allocated:null,shortage:null,unreserved:input.group===4?input.qty:0,pendingQty:input.group===3?input.qty:0,parts:[],priorParts:[],notes:['ตัวอย่างสำหรับทดสอบเท่านั้น'],commercial:{termKind:input.term,termLabel:input.term,summaryLabel:input.group===2?'TT · เก็บเงินแล้ว':input.term==='LC'?'LC · มี ETD รอเก็บ LC':'รอเงื่อนไข / ตามต้นทาง',salesLabel:input.group<=2||input.term==='LC'?'ขายแล้วตามเกณฑ์ตัวอย่าง':'รอเงื่อนไข',receiptLabel:input.group<=2?'รับแล้วตามตัวอย่าง':'รอรับ / รอยืนยัน',receiptDateLabel:input.group<=2?'2000-01-01':'รอระบุ',soldByOwnerRule:input.group<=2||input.term==='LC',etdValid:input.group!==4,notes:[]},queue:{group:input.group,eligible:input.group===2||input.group===3,etdISO:input.group===4?null:'2000-01-15',reason:'การจัดกลุ่มข้อมูลสมมติ',allocated:null,shortage:null,parts:[]}};});
const byRowId=Object.fromEntries(rows.map((row,index)=>[row.id,{...row,id:row.id,orderId:row.orderId,group:row.queue.group,sale:row.cancelled?{status:'cancelled-no-demand',amount:0,currency:null,unitPrice:null}:{status:'verified',amount:row.qty*definitions[index].price,currency:definitions[index].currency,unitPrice:definitions[index].price,commercialTerm:'SYNTHETIC',source:'ราคาแต่งขึ้นสำหรับทดสอบ',sourceDocument:row.ref}}]));
const orders=rows.map(row=>{const sale=byRowId[row.id].sale,currency=sale.currency||'THB',amount=sale.amount,received=row.queue.group<=2?amount:0,pending=row.queue.group===3?amount:0,unconfirmed=row.queue.group===4?amount:0;return {orderId:row.orderId,ref:row.ref,customer:row.customer,rowIds:[row.id],sale:native(currency==='THB'?amount:0,currency==='USD'?amount:0),saleComplete:true,received:native(currency==='THB'?received:0,currency==='USD'?received:0),pending:native(currency==='THB'?pending:0,currency==='USD'?pending:0),unconfirmed:native(currency==='THB'?unconfirmed:0,currency==='USD'?unconfirmed:0),term:row.term,sourcePayment:row.payment,receiptEvents:received?[{id:'SYNTH-EVENT-'+row.id,kind:'full',amount:received,currency,date:'2000-01-01',ref:row.ref,customer:row.customer}]:[],issues:[],settlement:{currency,saleAmount:amount,receivedAmount:received,pendingAmount:pending,unconfirmedAmount:unconfirmed,receiptEvents:received?[{id:'SYNTH-EVENT-'+row.id,kind:'full',amount:received,currency,date:'2000-01-01'}]:[]}};});
function moneyView(selected){return {groups:Object.fromEntries([0,1,2,3,4].map(id=>{const members=id?selected.filter(row=>row.queue.group===id):selected,ids=new Set(members.map(row=>row.id)),chosen=orders.filter(order=>order.rowIds.some(id=>ids.has(id)));return [id,{lineCount:members.length,quantity:members.reduce((n,row)=>n+row.qty,0),saleComplete:true,missingPriceLineCount:0,unconfirmedLineCount:members.filter(row=>row.queue.group===4&&row.qty>0).length,...Object.fromEntries(['sale','received','pending','unconfirmed'].map(field=>[field,chosen.reduce((n,order)=>sumNative(n,order[field]),native())])),orders:chosen,receiptEvents:chosen.flatMap(order=>order.receiptEvents),issues:[]}];}))};}
const fx={rate:30,date:'2000-01-01',basis:'SYNTHETIC TEST RATE'};
const freeRows=specs.filter(row=>row.free>0).map(row=>({...row,valueNative:row.free*row.price,valueTHB:row.free*row.price*(row.currency==='USD'?fx.rate:1),status:'valued'}));
function freeView(selected){return {rows:selected,specCount:selected.length,pendingSpecCount:0,totals:Object.fromEntries(['sheet','strip'].map(unit=>{const group=selected.filter(row=>row.unit===unit);return [unit,{qty:group.reduce((n,row)=>n+row.free,0),eq25:group.reduce((n,row)=>n+row.free*row.w*row.l*row.t/(1220*2440*2.5),0)}];})),valuation:{valueTHB:selected.reduce((n,row)=>n+row.valueTHB,0),knownValueTHB:selected.reduce((n,row)=>n+row.valueTHB,0),valuedSpecCount:selected.length,totalSpecCount:selected.length,complete:true}};}
const thicknesses=[...new Set(specs.map(row=>row.t))];
const review={metadata:{title:'ภาพรวมรายการขาย · ข้อมูลสมมติ',month:'2000-01',monthLabel:'มกราคม 2543 · สมมติ',stockReportDate:'2000-01-01',sourceSalesCapturedAt:'2000-01-01',sourceSalesReadLabel:'ข้อมูลสมมติสำหรับทดสอบ ไม่ใช่ข้อมูลสด',stockPoolWarning:'ฐานสมมติเดิม ไม่ใช่ Free หลังคิวใหม่'},rows,stockPools:specs,queueReview:{rows,groups:[{id:1,label:'โหลดแล้ว',description:'ไม่หักสต๊อกซ้ำ'},{id:2,label:'รับเงินแล้ว · ยังไม่โหลด',description:'จัดก่อนคิวจอง'},{id:3,label:'จอง / มี ETD',description:'LC มี ETD เป็นขายแล้วรอเก็บ LC'},{id:4,label:'รอเงื่อนไข',description:'คงต้นทาง ไม่แปลงเป็นยอดขายยืนยัน'}],stockBasis:{readbackLabel:'ฐานสมมติเพื่อทดสอบภาพเท่านั้น'},poolQueues:[{...specs[0],opening:120,basisLabel:'กองจำลอง',rows:[{rowId:rows[1].id,requested:30,availableBefore:120,allocated:30,shortage:0,remaining:90,etdISO:'2000-01-15'}]}]},financial:{metadata:{month:'2000-01',asOf:'2000-01-01',priceAsOf:'2000-01-01',cashAsOf:'2000-01-01',salesAsOf:'2000-01-01',fx,warning:'ตัวเลขเงินจริงทุกช่องเป็นข้อมูลทดสอบสมมติ'},byRowId,orders,views:{all:moneyView(rows),...Object.fromEntries(thicknesses.map(t=>[String(t),moneyView(rows.filter(row=>row.t===t))]))}},freeStock:{metadata:{reportDate:'2000-01-01',readAt:'2000-01-01',isCurrentQueueFree:false,sourceLabel:'ฐาน Free สมมติ',fxLabel:'USD/THB สมมติ 30',fx},rows:freeRows,views:{all:freeView(freeRows),...Object.fromEntries(thicknesses.map(t=>[String(t),freeView(freeRows.filter(row=>row.t===t))]))}},trackingImport:{sourceLabel:'Excel สมมติ',items:specs.map((row,index)=>({key:row.key,records:[{followup:'ตัวอย่างติดตามสินค้า '+(index+1),followupBy:'ผู้ทดสอบสมมติ',followupAt:'2000-01-01',excelRow:index+2}],legacyNotes:[],stockNotes:[]}))},reconciliation:{summary:'ผลเปรียบเทียบสมมติ ไม่ใช่การรับรองข้อมูลจริง',rows:[{label:'รายการทั้งหมด',unit:'บรรทัด',previous:rows.length,current:rows.length,difference:0,status:'ตรงในข้อมูลทดสอบ',note:'สมมติ'}],headerStockValuations:{physical:{equivalentTHB:specs.reduce((n,row)=>n+row.physical*row.price*(row.currency==='USD'?30:1),0)},free:{equivalentTHB:freeRows.reduce((n,row)=>n+row.valueTHB,0)},otherReservationDemand:{equivalentTHB:20*2*30}}}};
let readModel={selectedMonth:'2000-01',availableMonths:['2000-01'],sourceIsLive:false,queueApplied:false,stale:false,warning:'ข้อมูลทดสอบสมมติ · ไม่เรียกบริการส่วนกลาง',reviewStockReportDate:'2000-01-01',currentStockReportDate:'2000-01-01',reportDateMatches:true,physicalMatches:true,freeMatches:true,stockMatches:true,pricesMatch:true,fxMatches:true};
let savedNotes=Object.fromEntries(specs.map((row,index)=>[row.key,index?'':'หมายเหตุสมมติที่ใช้ร่วมกับ Free Stock'])),revision=1;
let canEditFollowup=true;
const followups=specs.map((row,index)=>({rawKey:'SYNTH-RAW-'+index,specKey:row.key,note:'',noteBy:'',noteAt:'',followup:index===1?'':'ติดตามส่วนกลางสมมติ '+(index+1),followupBy:index===1?'':'ผู้บันทึกสมมติ',followupAt:index===1?'':'2000-01-01T00:00:00Z'}));
followups.push({...followups[2],rawKey:'SYNTH-RAW-REVERSED',followup:'ข้อความกลับด้านสมมติแยกแถว'});
function notesSnapshot(){return {rows:specs.map(row=>({key:row.key,w:row.w,l:row.l,t:row.t,grade:row.grade,unit:row.unit,records:followups.filter(record=>record.specKey===row.key).map(({specKey,...record})=>record)})),notesBySpec:{...savedNotes},legacyNotesByThickness:{'2':'หมายเหตุความหนาเดิมสมมติ · อ่านอย่างเดียว'},revision,catalogRevision:revision,readAt:'2000-01-01T00:00:00Z',reportDate:'2000-01-01',canSave:true,canEditFollowup};}
async function saveSyntheticChanges(payload){
  for(const change of payload.notesChanges)if((savedNotes[change.key]||'')!==change.before)throw Error('Synthetic note conflict');
  for(const change of payload.followupChanges)if(!canEditFollowup||followups.find(record=>record.rawKey===change.rawKey)?.followup!==change.before)throw Error('Synthetic followup conflict');
  for(const change of payload.notesChanges)savedNotes[change.key]=change.after;
  for(const change of payload.followupChanges){const record=followups.find(record=>record.rawKey===change.rawKey);record.followup=change.after;record.followupBy='ผู้ทดสอบสมมติจากระบบ';record.followupAt='2000-01-02T01:02:03Z';}
  revision++;document.getElementById('fixture-status').textContent='บันทึกในหน่วยความจำทดสอบเท่านั้น · หมายเหตุ '+payload.notesChanges.length+' / ติดตาม '+payload.followupChanges.length;return clone(notesSnapshot());
}
const expanded=new Set();
function renderHeader(){const model=AAFOrderHeader.build(review,readModel);document.getElementById('header-source').textContent=AAFOrderHeader.sourceText(model);document.getElementById('header-cards').innerHTML=AAFOrderHeader.render(model,expanded);}
const ui=AAFOrderReviewUI.mount(document.getElementById('review-host'),{...review,readModel},{readNotes:async()=>clone(notesSnapshot()),saveChanges:saveSyntheticChanges,saveNotes:changes=>saveSyntheticChanges({notesChanges:changes,followupChanges:[]}),prepareNotesFile:async()=>({changes:[],issues:[{message:'ชุดหน้าทดสอบนี้ไม่อ่านไฟล์จริง · เส้นทางนำเข้าตรวจด้วย synthetic unit tests'}],canApply:false}),onViewChange:view=>{document.getElementById('fixture-status').textContent='มุมมอง 02 '+view.thickness+' · 01 ยังคงทุกความหนาของเดือน '+view.month;}});
document.getElementById('header-cards').addEventListener('click',event=>{const button=event.target.closest('[data-stock-card-toggle]');if(!button)return;const key=button.dataset.stockCardToggle;if(expanded.has(key))expanded.delete(key);else expanded.add(key);renderHeader();});
document.getElementById('fixture-stale').addEventListener('click',()=>{const stale=!readModel.stale;readModel={...readModel,stale,physicalMatches:!stale,stockMatches:!stale,currentStockReportDate:stale?'2000-01-02':'2000-01-01',reportDateMatches:!stale,warning:stale?'จำลองว่าฐาน Physical ส่วนกลางต่างจากชุดตรวจย้อนหลัง':'ข้อมูลสมมติตรงกัน · ไม่ใช่ฟีดสด',mismatches:stale?[{key:specs[0].key,reviewPhysical:120,currentPhysical:110,reviewFree:50,currentFree:40}]:[]};renderHeader();ui.update({...review,readModel});});
document.getElementById('fixture-refresh').addEventListener('click',()=>{ui.update({...review,readModel});renderHeader();});
document.getElementById('fixture-rights').addEventListener('click',()=>{canEditFollowup=!canEditFollowup;ui.applyNotesSnapshot(clone(notesSnapshot()));document.getElementById('fixture-status').textContent='สิทธิ์แก้ติดตามสมมติ: '+canEditFollowup;});
renderHeader();
</script>
