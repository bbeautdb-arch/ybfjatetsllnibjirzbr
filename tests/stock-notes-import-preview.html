<!doctype html>
<html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Notes-only Excel import · synthetic QA</title>
<link rel="stylesheet" href="../stock_sales_preview.css">
<style>body{font-family:Arial,sans-serif;color:#172b42;background:#eef3f7;margin:24px}main{max-width:1400px;margin:auto;background:white;padding:20px;border-radius:14px}button{padding:9px;margin:4px}.qa{border:1px solid #d3dfeb;padding:12px;margin-bottom:18px}#sales-stock-preview-16{max-width:100%}</style>
<main><div class="qa"><strong>ทดสอบข้อมูลสมมติ · ไม่เชื่อมต่อหรือเขียนระบบจริง</strong><p>ปุ่มตัวอย่างอ่าน workbook ด้วยตัวนำเข้าจริง ส่วนการเซฟจำลองเก็บในหน่วยความจำหน้านี้เท่านั้น</p><button id="sample">ตรวจตัวอย่าง AD</button><button id="legacy">ตรวจตัวอย่าง AE</button><button id="download">ดาวน์โหลด Excel ตัวอย่าง</button><p id="proof" role="status">ยังไม่มีการเซฟจำลอง</p></div><section id="sales-stock-preview-16"></section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="../stock_notes_import.js"></script><script src="../stock_sales_preview.js"></script>
<script>
'use strict';
const rows=[{sku:'TEST-NOTE-F',w:1220,l:2440,t:2,grade:'F',unit:'sheet',physical:10},{sku:'TEST-NOTE-ZERO',w:1200,l:2400,t:2,grade:'B',unit:'sheet',physical:0},{sku:'TEST-NOTE-STRIP',w:25,l:2440,t:3.2,grade:'B',unit:'strip',physical:20}];
const initial={modelContent:{scope:'synthetic'},privateContent:{version:3,context:'aaf-sales-stock-preview|free-price-catalog',fx:33,prices:{'2|F|1220|2440|sheet':12,'3.2|B|25|2440|strip':2},currencies:{},notesBySpec:{'2|F|1220|2440|sheet':'หมายเหตุเดิมสมมติ'},notesByThickness:{'2':'ข้อความเดิมร่วมความหนา'},savedAt:'2026-01-01T00:00:00Z'}};
const stockBefore=JSON.stringify(rows),priceBefore=JSON.stringify(initial.privateContent.prices);
const store={widgetState:initial,load(){return this.widgetState;},async setWidgetState(value){this.widgetState=value;return value;},async updateNotes(changes){for(const c of changes){if((this.widgetState.privateContent.notesBySpec[c.key]||'')!==c.before)throw Object.assign(Error('conflict'),{code:'catalog-conflict'});this.widgetState.privateContent.notesBySpec[c.key]=c.after;}this.widgetState.privateContent.savedAt=new Date().toISOString();document.getElementById('proof').textContent='เซฟจำลอง '+changes.length+' สเปก · จำนวนคงเดิม: '+(JSON.stringify(rows)===stockBefore)+' · ราคาคงเดิม: '+(JSON.stringify(this.widgetState.privateContent.prices)===priceBefore);return structuredClone(this.widgetState);}};
const model=AAFSalesPreview.buildModel([],rows,{strict:true,paidOverrideRefs:[]});
const view=AAFSalesPreview.mount(document.getElementById('sales-stock-preview-16'),model,{notesImportRows:rows,metadata:{monthLabel:'ข้อมูลทดสอบ'},fxReference:{rate:33}},store);
function workbook(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['SKU','กว้าง','ยาว','หนา','เกรด','หน่วย','หมายเหตุรายสินค้า','หมายเหตุความหนาเดิม'],['TEST-NOTE-F',1220,2440,2,'F','แผ่น','ลูกค้าขอดูตัวอย่าง — ข้อความสมมติ','ตัวอย่างเดิมร่วมความหนา'],['TEST-NOTE-ZERO',1200,2400,2,'B','แผ่น','รอผลิต — ข้อความสมมติ','ตัวอย่างเดิมร่วมความหนา'],['TEST-NOTE-STRIP',25,2440,3.2,'B','ชิ้น','แยกไม้แถบ — ข้อความสมมติ','']]),'หมายเหตุสินค้า');return wb;}
async function show(column){await view.ready;const free=document.querySelector('.sp-global-free');free.hidden=false;free.open=true;const panel=document.querySelector('[data-notes-import-panel]');panel.hidden=false;document.querySelector('[data-notes-column]').value=column;view.prepareNotesImportWorkbook(workbook(),{column});panel.scrollIntoView({block:'start'});}
document.getElementById('sample').onclick=()=>show('AD');document.getElementById('legacy').onclick=()=>show('AE');document.getElementById('download').onclick=()=>XLSX.writeFile(workbook(),'AAF_notes_synthetic.xlsx');
</script></html>
