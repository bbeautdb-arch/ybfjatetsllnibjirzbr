<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SYNTHETIC · Current sales only</title><style>body{margin:0;background:#eef3f1;color:#19372c;font-family:system-ui,sans-serif}header.fixture{padding:18px 24px;background:#fff6d7;border-bottom:2px solid #e4b949}header.fixture h1{font-size:20px;margin:0 0 8px}header.fixture p{margin:5px 0}#test-status{font-weight:700}#review{max-width:1400px;margin:18px auto;padding:0 12px}button{font:inherit;padding:8px 12px;margin:6px 6px 0 0}</style></head>
<body><header class="fixture"><h1>SYNTHETIC — ข้อมูลตัวอย่างเท่านั้น ไม่ใช่ยอดบริษัท</h1><p>ขายแล้ว: 30 แผ่น + 5 ชิ้นไม้แถบ · แผนรวม: 50 แผ่น + 20 ชิ้นไม้แถบ · ยกเลิกเก็บต้นทางอีก4แผ่นโดยไม่นับยอดสั่ง</p><p>Physical / การจัดสรร / Free / ต้องผลิตยังไม่ยืนยันทั้งหมด ไม่มีการเชื่อมต่อหรือบันทึกข้อมูลธุรกิจ</p><button id="valid" type="button">แสดงข้อมูลขายที่ตรวจแล้ว</button><button id="invalid" type="button">ทดสอบปฏิเสธยอดขาดปลอม 0</button><p id="test-status" role="status"></p></header><div id="review"></div>
<script src="../stock_order_header.js?v=20261103-sales-only-r1"></script><script src="../stock_order_review.js?v=20261103-sales-only-r1"></script><script type="module">
import {salesOnlyFixture} from './stock-sales-only-fixture.mjs';
const fixture=salesOnlyFixture(window.AAFOrderHeader.currentBangkokMonth()),status=document.getElementById('test-status');let view;
function show(){const good=window.AAFOrderHeader.salesOnlyReviewValid(fixture.review,fixture.readModel,fixture.currentMonthSold);status.textContent=good?'ผ่านสัญญาข้อมูลขายเท่านั้น · การจัดสรรยัง pending':'รูปแบบตัวอย่างไม่ผ่าน';if(good){const data={...fixture.review,readModel:fixture.readModel};if(view)view.update(data);else view=window.AAFOrderReviewUI.mount(document.getElementById('review'),data,{});}}

</script></body></html>
