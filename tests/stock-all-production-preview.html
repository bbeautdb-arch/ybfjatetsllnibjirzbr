<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthetic all-production summary</title>
<link rel="stylesheet" href="../stock_premium.css?v=20261104-factory-glass-r1">
<style>body{margin:0;padding:20px;font-family:Arial,sans-serif}.fixture-banner{padding:15px;background:#fff4d2;border:1px solid #d9bd78;border-radius:12px}.fixture-controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.fixture-controls button{padding:9px 14px;cursor:pointer}#stock-summary .ss-report-intro,#stock-summary .ss-status,#stock-summary .ss-tools,#stock-summary .ss-hero,#stock-summary .ss-context,#stock-summary .ss-groups,#stock-summary .ss-daily-overview,#stock-summary .ss-aging-chart,#stock-summary .ss-reservation-help,#stock-summary .ss-content>.ss-section-title,#stock-summary .ss-footer{display:none}#stock-summary .ss-content{padding:0}#stock-summary .ss-aging{padding:12px}#stock-summary .ss-aging-grid{font-size:11px}</style>
</head><body data-aaf-premium="ivory"><div class="fixture-banner"><b>ตัวอย่างทดสอบ — ไม่ใช่ข้อมูลบริษัท</b><br>กล่องรวมทุกสเปกที่ต้องผลิต แยกแผ่นกับไม้แถบ · ไม่เชื่อม API และไม่บันทึกข้อมูล</div><div class="fixture-controls"><button id="fixture-saved">แผนที่บันทึก</button><button id="fixture-zero">ไม่มีของขาด</button><button id="fixture-invalid">ข้อมูลไม่ตรงกัน</button></div><main id="stock-summary" data-aaf-stock-summary></main>
<script src="../stock_summary.js?v=20261104-all-production-r1"></script><script>
// Synthetic quantities only; not a warehouse allocation or order instruction.
const row=(key,t,grade,w,l,qty,committedQty,unit='sheet')=>({key,sku:key,desc:'Synthetic',t,grade,w,l,qty,committedQty,unit,freeQty:Math.max(qty-committedQty,0),baseQty:qty,d90:qty,d180:0,d270:0,d360:0,dOver:0});
const fixture={report:{reportDate:'2000-06-01',sourceRowCount:7},revision:8,exchangeRate:30,rows:[row('SYN-A',1.6,'F',1220,2440,240,8240),row('SYN-B',1.8,'AAA',1220,2440,600,1500),row('SYN-C',2.5,'B',1200,2400,0,2460),row('SYN-D',3.2,'AAA',1000,2000,90,515.25),row('SYN-E',4.5,'F',1220,2440,20,800),row('SYN-F',3.2,'B',25,1000,400,1700,'strip'),row('SYN-SPARE',1.6,'AAA',1220,2440,12000,400)]};
const calc=r=>({price:1,curr:'THB',value:r.qty,freeValue:r.freeQty,eq:r.qty*r.w*r.l/(1220*2440)*r.t/2.5});
const show=()=>AAFStockSummary.update(structuredClone(fixture),calc);
document.getElementById('fixture-saved').onclick=show;
document.getElementById('fixture-zero').onclick=()=>{const data=structuredClone(fixture);data.rows.forEach(r=>{r.committedQty=Math.min(r.qty,r.committedQty);r.freeQty=r.qty-r.committedQty;});AAFStockSummary.update(data,calc);};
document.getElementById('fixture-invalid').onclick=()=>{const m=AAFStockSummary.buildModel(structuredClone(fixture),calc);m.total.byUnit.sheet.reservedProductionQty++;document.querySelector('[data-all-production-summary]').outerHTML=AAFStockSummary.renderAllProduction(m);};
show();
</script></body></html>
