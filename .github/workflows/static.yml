# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public pages before deployment
        run: |
          node tests/public-confidentiality.mjs
          node tests/public-regression.mjs
          node tests/stock-catalog.mjs
          node tests/stock-morning.mjs
          node tests/stock-summary.mjs
          node --test tests/stock-aging-projection.mjs
          node --test tests/stock-daily-overview.mjs
          node tests/stock-report.mjs
          node --test tests/stock-cash.mjs
          node --test tests/stock-reservations.mjs
          node --test tests/stock-review-notes-bridge.mjs
          node --test tests/stock-order-controller.mjs tests/stock-order-review-ui.mjs tests/stock-order-header.mjs
          node --test tests/stock-sales-groups.mjs tests/stock-sales-groups-view.mjs
          node --test tests/stock-sales-receipts.mjs
          node --test tests/stock-current-sales-groups.mjs tests/stock-current-month-sold.mjs tests/stock-current-allocation.mjs tests/stock-sales-only-contract.mjs
          node --test tests/stock-free-composition.mjs tests/stock-upper-free-notes.mjs tests/stock-free-surface-lifecycle.mjs
          node --test tests/stock-annotations-import.mjs tests/stock-annotation-unlock-controller.mjs tests/stock-annotation-unlock-ui.mjs
          node --test tests/stock-admin-annotations.mjs
          node --test tests/stock-login-capability-exit.mjs
          node --test tests/stock-price-editor.mjs tests/stock-price-panel.mjs tests/stock-physical-free-value.mjs tests/stock-physical-grade-totals.mjs
          node --test tests/stock-category-free-values.mjs tests/stock-physical-free-pair.mjs
          node --test tests/stock-free-grade-summary-values.mjs
          node --test tests/stock-caption-contrast.mjs
          node --test tests/stock-premium.mjs tests/stock-glass-theme.mjs tests/stock-premium-polish.mjs
          node --test tests/stock-summary-export-snapshot.mjs tests/stock-price-missing-currency.mjs
          node --test tests/stock-readiness.mjs tests/stock-report-evidence.mjs tests/stock-ui-cleanup-nov04.mjs
      - name: Stage public files only
        run: |
          mkdir _site
          cp ./*.html ./*.js ./*.css _site/
          cp ./login-bg.png _site/
          cp ./icon.svg ./favicon.ico ./favicon-32.png ./apple-touch-icon.png ./icon-192.png ./icon-512.png ./manifest.webmanifest _site/
          mkdir -p _site/assets
          cp ./assets/aaf-factory-background.webp _site/assets/
          cp ./assets/production_plan.premium.css ./assets/production_plan.visual-hooks.js _site/assets/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
